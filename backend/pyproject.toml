[project]
name = "backend"
version = "0.1.0"
description = "Seal – personal AI assistant backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "vercel>=0.9.0",
    "asyncpg>=0.29.0",
    "httpx>=0.28.1",
    "ai[otel]>=0.4.1",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[tool.vercel]
entrypoint = "app.server:app"

[[tool.vercel.workflows]]
entrypoint = "app.worker:workflow"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.ty.environment]
python-version = "3.13"
root = ["./"]

[tool.ruff]
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30

[tool.uv]
exclude-newer = "2 days"
exclude-newer-package = { ai = false, vercel = false, vercel-cache = false, vercel-headers = false, vercel-internal-telemetry = false, vercel-oidc = false }
override-dependencies = [
    "vercel-cache",
    "vercel-headers",
    "vercel-internal-core",
    "vercel-internal-telemetry",
    "vercel-oidc",
    "vercel-queue",
    "vercel-sandbox",
    "vercel-workflow",
]

[tool.uv.sources]
ai = { git = "https://github.com/vercel-labs/ai-python", branch = "main" }
vercel = { git = "https://github.com/vercel/vercel-py", branch = "main", subdirectory = "src/vercel" }
vercel-cache = { git = "https://github.com/vercel/vercel-py", branch = "main", subdirectory = "src/vercel-cache" }
vercel-headers = { git = "https://github.com/vercel/vercel-py", branch = "main", subdirectory = "src/vercel-headers" }
vercel-internal-core = { git = "https://github.com/vercel/vercel-py", branch = "main", subdirectory = "src/vercel-internal-core" }
vercel-internal-telemetry = { git = "https://github.com/vercel/vercel-py", branch = "main", subdirectory = "src/vercel-internal-telemetry" }
vercel-oidc = { git = "https://github.com/vercel/vercel-py", branch = "main", subdirectory = "src/vercel-oidc" }
vercel-queue = { git = "https://github.com/vercel/vercel-py", branch = "main", subdirectory = "src/vercel-queue" }
vercel-sandbox = { git = "https://github.com/vercel/vercel-py", branch = "main", subdirectory = "src/vercel-sandbox" }
vercel-workflow = { git = "https://github.com/vercel/vercel-py", branch = "main", subdirectory = "src/vercel-workflow" }

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.5",
    # ty 0.0.69 mis-flags fields of a ConfigDict(frozen=False) subclass of a
    # frozen pydantic model as read-only (tests/conftest.py MockProvider).
    "ty==0.0.44",
]
